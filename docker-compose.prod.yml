services:
  seq:
    image: datalust/seq:${SEQ_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - "${SEQ_PORT:-5341}:80"
    volumes:
      - ${FRAMEDATA_SEQ_DATA:-./data/seq}:/data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-framedata}
      POSTGRES_USER: ${POSTGRES_USER:-framedata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${FRAMEDATA_POSTGRES_DATA:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${FRAMEDATA_IMAGE_REPOSITORY:-ghcr.io/nmur}/framedata-api:${FRAMEDATA_IMAGE_TAG:-stable}
    pull_policy: always
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB:-framedata};Username=${POSTGRES_USER:-framedata};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Ingestion__ExportPath: /app/exports/characters
      Ingestion__SourceBaseUrl: ${INGESTION_SOURCE_BASE_URL:-http://ensabahnur.free.fr/BastonNew/index.php}
      Ingestion__Characters: ${INGESTION_CHARACTER_SCOPE:-}
      FRAMEDATA_BACKUP_PATH: ${FRAMEDATA_BACKUP_PATH:-/app/exports/backups/latest}
      FRAMEDATA_RESTORE_PATH: ${FRAMEDATA_RESTORE_PATH:-/app/exports/backups/latest}
      SEQ_SERVER_URL: ${SEQ_SERVER_URL:-http://seq}
      SEQ_API_KEY: ${SEQ_API_KEY:-}
      SEQ_MINIMUM_LEVEL: ${SEQ_MINIMUM_LEVEL:-Debug}
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ${FRAMEDATA_EXPORTS_PATH:-./data/exports}:/app/exports

  bot:
    image: ${FRAMEDATA_IMAGE_REPOSITORY:-ghcr.io/nmur}/framedata-bot:${FRAMEDATA_IMAGE_TAG:-stable}
    pull_policy: always
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      BOT_GUILD_ID: ${BOT_GUILD_ID}
      BOT_API_BASE_URL: ${BOT_API_BASE_URL:-http://api:8080}
      SEQ_SERVER_URL: ${SEQ_SERVER_URL:-http://seq}
      SEQ_API_KEY: ${SEQ_API_KEY:-}
      SEQ_MINIMUM_LEVEL: ${SEQ_MINIMUM_LEVEL:-Debug}
    depends_on:
      api:
        condition: service_started
      seq:
        condition: service_started

  ingestion:
    image: ${FRAMEDATA_IMAGE_REPOSITORY:-ghcr.io/nmur}/framedata-ingestion:${FRAMEDATA_IMAGE_TAG:-stable}
    pull_policy: always
    restart: "no"
    environment:
      POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB:-framedata};Username=${POSTGRES_USER:-framedata};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Ingestion__ExportPath: /app/exports/characters
      Ingestion__SourceBaseUrl: ${INGESTION_SOURCE_BASE_URL:-http://ensabahnur.free.fr/BastonNew/index.php}
      SEQ_SERVER_URL: ${SEQ_SERVER_URL:-http://seq}
      SEQ_API_KEY: ${SEQ_API_KEY:-}
      SEQ_MINIMUM_LEVEL: ${SEQ_MINIMUM_LEVEL:-Debug}
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    volumes:
      - ${FRAMEDATA_EXPORTS_PATH:-./data/exports}:/app/exports
