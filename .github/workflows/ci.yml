name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore FrameDataBot.sln
      - name: Build
        run: dotnet build FrameDataBot.sln --no-restore
      - name: Test
        run: dotnet test FrameDataBot.sln --no-build
