name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "feat/**"
      - "001-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore FrameDataBot.sln
      - name: Build
        run: dotnet build FrameDataBot.sln --no-restore
      - name: Test
        run: dotnet test FrameDataBot.sln --no-build

  publish-preview-images:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/001-'))
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Determine preview image metadata
        id: meta
        run: |
          BRANCH_RAW="${GITHUB_REF_NAME}"
          BRANCH_SANITIZED="$(echo "${BRANCH_RAW}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g' | sed -E 's#^-+##; s#-+$##')"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          DEV_TAG="dev-${BRANCH_SANITIZED}-${SHA_SHORT}"
          BRANCH_TAG="dev-${BRANCH_SANITIZED}-latest"
          echo "dev_tag=${DEV_TAG}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push preview API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/framedata-api:${{ steps.meta.outputs.dev_tag }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/framedata-api:${{ steps.meta.outputs.branch_tag }}
      - name: Build and push preview Ingestion image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ingestion
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/framedata-ingestion:${{ steps.meta.outputs.dev_tag }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/framedata-ingestion:${{ steps.meta.outputs.branch_tag }}
      - name: Build and push preview Bot image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.bot
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/framedata-bot:${{ steps.meta.outputs.dev_tag }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/framedata-bot:${{ steps.meta.outputs.branch_tag }}
