name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore FrameDataBot.sln
      - name: Build
        run: dotnet build FrameDataBot.sln --no-restore
      - name: Test
        run: dotnet test FrameDataBot.sln --no-build

  publish-images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine image metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME}"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/framedata-api:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/framedata-api:sha-${{ steps.meta.outputs.sha_short }}
      - name: Build and push ingestion image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ingestion
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/framedata-ingestion:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/framedata-ingestion:sha-${{ steps.meta.outputs.sha_short }}
      - name: Build and push bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.bot
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/framedata-bot:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/framedata-bot:sha-${{ steps.meta.outputs.sha_short }}

  create-release:
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
