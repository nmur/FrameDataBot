version: "3.9"
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: framedata
      POSTGRES_USER: framedata
      POSTGRES_PASSWORD: framedata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=framedata;Username=framedata;Password=framedata
    depends_on:
      - postgres

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      BOT_GUILD_ID: ${BOT_GUILD_ID}
      BOT_API_BASE_URL: ${BOT_API_BASE_URL:-http://api:8080}
    depends_on:
      - api

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    environment:
      POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=framedata;Username=framedata;Password=framedata
    depends_on:
      - postgres

volumes:
  postgres_data:
